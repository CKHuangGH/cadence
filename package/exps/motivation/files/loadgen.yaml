apiVersion: v1
kind: Service
metadata:
  name: cadence-app
  namespace: cadence
spec:
  selector:
    app: cadence-app
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cadence-load-script
  namespace: cadence
data:
  load.js: |
    import http from 'k6/http';
    import { check } from 'k6';

    export const options = {
      scenarios: {
        steady: {
          executor: 'constant-arrival-rate',
          rate: Number(__ENV.RPS || 10),
          timeUnit: '1s',
          duration: '120s',
          preAllocatedVUs: 50,
          maxVUs: 200,
        },
      },
    };

    export default function () {
      const res = http.get(
        'http://cadence-app.cadence.svc.cluster.local/'
      );

      check(res, {
        'HTTP 200': (r) => r.status === 200,
      });
    };

---
apiVersion: batch/v1
kind: Job
metadata:
  name: cadence-loadgen
  namespace: cadence
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        cadence-role: loadgen
      containers:
        - name: k6
          image: grafana/k6:1.8.2
          args: ["run", "/scripts/load.js"]
          env:
            - name: RPS
              value: "10"
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: cadence-load-script